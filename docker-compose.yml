services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: activity
    volumes: [pg_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d activity"]
      interval: 5s
      retries: 10
    networks: [app_net]       
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/activity
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
    depends_on:
      postgres: {condition: service_healthy}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks: [app_net]
  frontend:
    build: ./frontend    
    ports: ["80:80"]
    depends_on: [backend]
    networks: [app_net]
networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
volumes:
  pg_data: